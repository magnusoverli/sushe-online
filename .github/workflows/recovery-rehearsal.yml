name: Recovery and Upgrade Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '26.10.0'

# Run before releasing backup, recovery, migration or deployment changes.
jobs:
  recovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build test harness
        run: docker compose -f docker-compose.test.yml build tests
      - name: Rehearse automatic recovery with production-only images
        run: |
          docker compose -f docker-compose.recovery-test.yml up --build -d --wait app recovery
          docker compose -f docker-compose.recovery-test.yml run --rm --no-deps tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rehearse image-only upgrade from the published baseline
        run: |
          docker tag sushe-recovery-test:local sushe-upgrade-candidate:local
          node scripts/rehearse-legacy-upgrade.js
      - name: Collect sanitized recovery logs
        if: failure()
        run: docker compose -f docker-compose.recovery-test.yml logs app recovery > recovery.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: recovery-rehearsal
          path: recovery.log
          retention-days: 7
      - name: Remove disposable databases
        if: always()
        run: |
          docker compose -f docker-compose.recovery-test.yml down --volumes
          docker compose -f docker-compose.upgrade-test.yml down --volumes
