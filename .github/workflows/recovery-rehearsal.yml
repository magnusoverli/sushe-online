name: Recovery and Upgrade Rehearsal

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'scripts/docker-entrypoint-upgrade.sh'
      - 'scripts/rehearse-image-update.js'
      - 'services/deployment/**'
      - 'services/recovery/**'
      - 'services/admin-backup-service.js'
      - 'test/deployment/**'
      - 'test/recovery/**'
      - '.github/workflows/recovery-rehearsal.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '26.13.0'

# Run before releasing backup, recovery, migration or deployment changes.
jobs:
  recovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build test harness
        run: docker compose -f docker-compose.test.yml build tests
      - name: Rehearse automatic recovery with production-only images
        run: |
          docker compose -f docker-compose.recovery-test.yml up --build -d --wait app recovery
          docker compose -f docker-compose.recovery-test.yml run --rm --no-deps tests
      - name: Check the packaged database entrypoint and volume selection
        run: |
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' sushe-postgres:local)" = /usr/local/bin/docker-entrypoint-upgrade.sh
          docker run --rm --network none --tmpfs /var/lib/postgresql \
            -v "$PWD/test/deployment/pgdata-selection.sh:/probe.sh:ro" \
            --entrypoint bash sushe-postgres:local /probe.sh
          docker run --rm --network none --read-only --entrypoint node sushe-recovery-test:local -e '
            const c=require("./services/admin-backup-service").createAdminBackupService({env:{}}).getRuntimeConfig();
            for(const bin of [c.pgDumpCmd,c.pgRestoreCmd]){
              if(!require("child_process").execFileSync(bin,["--version"],{encoding:"utf8"}).includes(" 19."))process.exit(1);
            }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rehearse image-only upgrade from the published baseline
        run: node scripts/rehearse-image-update.js
      - name: Collect sanitized recovery logs
        if: failure()
        run: docker compose -f docker-compose.recovery-test.yml logs app recovery > recovery.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: recovery-rehearsal
          path: recovery.log
          retention-days: 7
      - name: Remove disposable databases
        if: always()
        run: |
          docker compose -f docker-compose.recovery-test.yml down --volumes
