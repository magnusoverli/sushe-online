name: Container Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [app, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Prepare image
        id: image
        env:
          TARGET: ${{ matrix.image }}
        run: |
          if [ "$TARGET" = app ]; then
            image=sushe-security:local
            docker build --pull --build-arg INSTALL_DEV_DEPS=false -t "$image" .
          else
            image=sushe-postgres:local
            docker build --pull -f Dockerfile.postgres -t "$image" .
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Report all vulnerabilities and block fixable high/critical findings
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          trivy image --scanners vuln --format json --output image-security.json "$IMAGE"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-security-${{ matrix.image }}
          path: image-security.json
          if-no-files-found: warn
          retention-days: 14
