name: Security Reports

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '26.10.0'
  NPM_VERSION: '12.1.0'

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit
      - name: Collect dependency findings (advisory)
        continue-on-error: true
        run: npm audit --json > dependency-audit.json
      - name: Summarize dependency findings
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            throw new Error('Dependency audit could not complete; inspect the report artifact.');
          }
          const counts = report.metadata.vulnerabilities;
          const summary = `Dependency findings: ${counts.critical} critical, ${counts.high} high, ${counts.moderate} moderate, ${counts.low} low.\n\nAdvisory only; review dependency-audit.json.\n`;
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [app, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Prepare image
        id: image
        env:
          TARGET: ${{ matrix.image }}
        run: |
          if [ "$TARGET" = app ]; then
            image=sushe-security:local
            docker build --pull --build-arg INSTALL_DEV_DEPS=false -t "$image" .
          else
            image=sushe-postgres:local
            docker build --pull -f Dockerfile.postgres -t "$image" .
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Report container vulnerabilities (advisory)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          trivy image --scanners vuln --format json --output image-security.json "$IMAGE"
          trivy convert --format table --severity HIGH,CRITICAL image-security.json
          echo "Advisory scan for $IMAGE. Review the findings in the step log and image-security.json artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-security-${{ matrix.image }}
          path: image-security.json
          if-no-files-found: warn
          retention-days: 14
