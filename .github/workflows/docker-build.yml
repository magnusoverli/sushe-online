name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUILDKIT_VERSION: 'v0.32.2'
  BUILDX_VERSION: 'v0.36.1'
  DOCKER_VERSION: 'v29.7.2'
  NODE_VERSION: '26.7.0'
  NPM_VERSION: '12.0.2'

jobs:
  test:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: example
          POSTGRES_DB: sushe
          POSTGRES_INITDB_ARGS: '--auth-host=md5'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sushe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:example@localhost:5432/sushe
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      DISABLE_RATE_LIMITING: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Enable PostgreSQL extensions
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'

      - name: Start application server
        run: |
          npm run build
          node index.js &
          # Wait for server to be ready (up to 60 seconds)
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Server failed to start within 60 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run structural baseline guardrail
        run: npm run lint:structure:baseline

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: example
          POSTGRES_DB: sushe
          POSTGRES_INITDB_ARGS: '--auth-host=md5'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sushe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:example@localhost:5432/sushe
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      DISABLE_RATE_LIMITING: 'true'
      PLAYWRIGHT_SKIP_SERVER: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Enable PostgreSQL extensions
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'

      - name: Start application server
        run: |
          npm run build
          node index.js &
          # Wait for server to be ready (up to 60 seconds)
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Server failed to start within 60 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    needs: [test, e2e]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync retry-generated changelog
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            unexpected_changes="$(git diff --name-only HEAD..origin/main -- . ':(exclude)src/data/changelog.json')"
            if [ -n "$unexpected_changes" ]; then
              echo "Refusing to build untested changes from a newer main revision:"
              echo "$unexpected_changes"
              exit 1
            fi
            git merge --ff-only origin/main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog entries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ci-changelog.js

      - name: Commit changelog updates
        run: |
          if git diff --quiet src/data/changelog.json 2>/dev/null; then
            echo "No changelog changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/changelog.json
            git commit -m "Update changelog [skip ci]"
            git push
          fi

      - name: Resolve image revision
        id: image_revision
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "version=$(node -p 'require(\"./package.json\").version')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: ${{ env.DOCKER_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=moby/buildkit:${{ env.BUILDKIT_VERSION }}@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Report Docker build versions
        run: |
          docker version
          docker buildx version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-${{ steps.image_revision.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image_revision.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.image_revision.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ steps.image_revision.outputs.sha }}
            BUILD_DATE=${{ steps.image_revision.outputs.created }}
            VCS_REF=${{ steps.image_revision.outputs.sha }}
            VERSION=${{ steps.image_revision.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
