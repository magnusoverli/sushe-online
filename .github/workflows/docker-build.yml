name: Build and Push Docker Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - src/data/changelog.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUILDKIT_VERSION: 'v0.33.0'
  BUILDX_VERSION: 'v0.37.1'
  DOCKER_VERSION: 'v29.8.1'
  NODE_VERSION: '26.10.0'
  NPM_VERSION: '12.1.0'

permissions:
  contents: read

jobs:
  container-security:
    uses: ./.github/workflows/container-security.yml

  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - run: npm ci --ignore-scripts
      # Registry errors also fail the gate: rerun after the outage, never ignore it.
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate

  recovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build test harness
        run: docker compose -f docker-compose.test.yml build tests
      - name: Rehearse automatic recovery with production-only images
        run: |
          docker compose -f docker-compose.recovery-test.yml up --build -d --wait app recovery
          docker compose -f docker-compose.recovery-test.yml run --rm --no-deps tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rehearse image-only upgrade from the published baseline
        run: |
          docker tag sushe-recovery-test:local sushe-upgrade-candidate:local
          node scripts/rehearse-legacy-upgrade.js
      - name: Collect sanitized recovery logs
        if: failure()
        run: docker compose -f docker-compose.recovery-test.yml logs app recovery > recovery.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: recovery-rehearsal
          path: recovery.log
          retention-days: 7
      - name: Remove disposable databases
        if: always()
        run: |
          docker compose -f docker-compose.recovery-test.yml down --volumes
          docker compose -f docker-compose.upgrade-test.yml down --volumes

  test:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: example
          POSTGRES_DB: sushe
          POSTGRES_INITDB_ARGS: '--auth-host=md5'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sushe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:example@localhost:5432/sushe
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      DB_AUTO_MIGRATE: 'true'
      SECOND_APP_URL: http://localhost:3001
      DISABLE_RATE_LIMITING: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Enable PostgreSQL extensions
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'

      - name: Start application server
        run: |
          npm run build
          node index.js &
          PORT=3001 node index.js &
          # Wait for server to be ready (up to 60 seconds)
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://localhost:3000/ready > /dev/null 2>&1 && curl --fail --silent --max-time 2 http://localhost:3001/ready > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Server failed to start within 60 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run structural baseline guardrail
        run: npm run lint:structure:baseline

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: example
          POSTGRES_DB: sushe
          POSTGRES_INITDB_ARGS: '--auth-host=md5'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sushe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:example@localhost:5432/sushe
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      DB_AUTO_MIGRATE: 'true'
      DISABLE_RATE_LIMITING: 'true'
      PLAYWRIGHT_SKIP_SERVER: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Enable PostgreSQL extensions
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'

      - name: Start application server
        run: |
          npm run build
          node index.js &
          # Wait for server to be ready (up to 60 seconds)
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://localhost:3000/ready > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Server failed to start within 60 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, e2e, audit, recovery, container-security]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync retry-generated changelog
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            unexpected_changes="$(git diff --name-only HEAD..origin/main -- . ':(exclude)src/data/changelog.json')"
            if [ -n "$unexpected_changes" ]; then
              echo "Refusing to build untested changes from a newer main revision:"
              echo "$unexpected_changes"
              exit 1
            fi
            git merge --ff-only origin/main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog entries
        if: github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ci-changelog.js

      - name: Commit changelog updates
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet src/data/changelog.json 2>/dev/null; then
            echo "No changelog changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/changelog.json
            git commit -m "Update changelog"
            git push
          fi

      - name: Resolve image revision
        id: image_revision
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "version=$(node -p 'require(\"./package.json\").version')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: ${{ env.DOCKER_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=moby/buildkit:${{ env.BUILDKIT_VERSION }}@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Report Docker build versions
        run: |
          docker version
          docker buildx version

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-${{ steps.image_revision.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image_revision.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.image_revision.outputs.sha }}

      - name: Build Docker image (publish on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          pull: true
          no-cache-filters: runtime
          build-args: |
            CACHE_BUST=${{ steps.image_revision.outputs.sha }}
            BUILD_DATE=${{ steps.image_revision.outputs.created }}
            VCS_REF=${{ steps.image_revision.outputs.sha }}
            VERSION=${{ steps.image_revision.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build PostgreSQL image (publish on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.postgres
          push: ${{ github.ref == 'refs/heads/main' }}
          pull: true
          # Refresh security packages even when the upstream image is unchanged.
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository }}-postgres:18
            ghcr.io/${{ github.repository }}-postgres:main-${{ steps.image_revision.outputs.short_sha }}
