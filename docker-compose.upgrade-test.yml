name: sushe-upgrade-test
services:
  db:
    image: sushe-postgres:local
    environment:
      POSTGRES_DB: sushe
      POSTGRES_PASSWORD: example
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      # A real disposable volume survives database image replacement.
      - database:/var/lib/postgresql
      - socket:/var/run/postgresql
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'pg_stat_statements.track_utility=off',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sushe']
      interval: 1s
      timeout: 3s
      retries: 30
  app:
    # Published PG19-only baseline; the rehearsal replaces only the app image.
    image: ${UPGRADE_IMAGE:-ghcr.io/magnusoverli/sushe-online@sha256:2d260487f36beea2af46d724fecc1e9ed14f90ecc4a238a93e015139d638e43b}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:example@/sushe?host=/var/run/postgresql
      DATA_DIR: /app/data
      BASE_URL: http://app:3000
      SESSION_SECRET: synthetic-upgrade-rehearsal-session-secret-0123456789
      BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.test
      BOOTSTRAP_ADMIN_PASSWORD: synthetic-bootstrap-rehearsal-only
    volumes:
      - data:/app/data
      - socket:/var/run/postgresql
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 90
  checks:
    image: sushe-backend-test:local
    profiles: [checks]
    user: '0:0'
    entrypoint: [node]
    environment:
      DEPLOYMENT_REHEARSAL: disposable
    volumes:
      - data:/state
      - socket:/var/run/postgresql
      - ./test/deployment:/app/test/deployment:ro
      - ./services/deployment:/app/services/deployment:ro
    tmpfs: [/tmp]
    command: ['test/deployment/image-update.js', 'verify']
volumes:
  database:
  data:
  socket:
networks:
  default:
    internal: true
