<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuShe Online</title>
    <link rel="stylesheet" href="extension-ui.css" />
  </head>
  <body class="popup">
    <div class="header"><h1>SuShe Online</h1></div>
    <main class="content">
      <div id="status" role="status" aria-live="polite"></div>
      <p>
        Right-click on album images or links on RateYourMusic to add them to
        your lists.
      </p>
      <button id="refreshBtn" class="btn-primary">
        <span class="icon">↻</span> Refresh Lists
      </button>
      <button id="optionsBtn" class="btn-secondary">
        <span class="icon">⚙</span> Settings
      </button>
      <button id="loginBtn" class="btn-accent">Login to SuShe</button>
      <button id="logoutBtn" class="btn-danger" style="display: none">
        Logout
      </button>
      <div id="lists" class="lists" style="display: none">
        <div class="lists-header">Your Lists</div>
        <div id="listItems"></div>
      </div>
    </main>
    <script src="extension-constants.js"></script>
    <script src="shared-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
