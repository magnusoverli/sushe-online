<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuShe Online - Extension Settings</title>
    <link rel="stylesheet" href="extension-ui.css" />
  </head>
  <body class="options">
    <main class="card">
      <div class="header"><h1>Extension Settings</h1></div>
      <div class="content">
        <section class="section">
          <form id="settingsForm">
            <label for="apiUrl">SuShe Online URL</label>
            <input
              type="url"
              id="apiUrl"
              name="apiUrl"
              placeholder="https://your-sushe-instance.com"
              required
              aria-describedby="urlHelp"
            />
            <p class="help-text" id="urlHelp">
              Enter the instance origin without a path. Use HTTPS, or HTTP for
              localhost development.
            </p>
            <button type="submit" class="btn-primary">Save Settings</button>
          </form>
          <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
          ></div>
        </section>
        <section class="section">
          <h2>Authentication</h2>
          <p class="help-text">
            Login saves the URL above before opening the authorization page.
          </p>
          <div id="authStatus" role="status" aria-live="polite">
            Checking...
          </div>
          <div class="auth-buttons">
            <button
              type="button"
              id="loginBtn"
              class="btn-accent"
              style="display: none"
            >
              Login
            </button>
            <button
              type="button"
              id="logoutBtn"
              class="btn-danger"
              style="display: none"
            >
              Logout
            </button>
          </div>
        </section>
        <section class="section">
          <h2>URL Examples</h2>
          <code class="example-code">http://localhost:3000</code>
          <code class="example-code">https://sushe.example.com</code>
        </section>
        <section class="section">
          <h2>Connection Test</h2>
          <button id="testBtn" class="btn-secondary">Test Connection</button>
          <div id="testResult" role="status" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="extension-constants.js"></script>
    <script src="shared-utils.js"></script>
    <script src="options.js"></script>
  </body>
</html>
